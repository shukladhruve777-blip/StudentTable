<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>View Students</h1>

    <input type="text" class="search-box" id="search_first" placeholder="First Name">
    <input type="text" class="search-box" id="search_last" placeholder="Last Name">
    <input type="text" class="search-box" id="search_age" placeholder="Age">
    <input type="text" class="search-box" id="search_program" placeholder="Program">
    <input type="text" class="search-box" id="search_start" placeholder="Start Date">
    <input type="text" class="search-box" id="search_end" placeholder="End Date">
    <button onclick="searchTable()" class="btn">Search</button>

    <table id="table">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Program</th>
            <th>Start Date</th>
            <th>End Date</th>
        </tr>
    </table>

    <a href="/" class="btn back-btn">Back to home</a>

    <script src="/static/script.js"></script>
</body>
</html>
